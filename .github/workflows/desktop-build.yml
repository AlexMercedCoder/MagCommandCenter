name: Desktop Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Frontend quality and browser smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > mag-command-center.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: mag-command-center-sbom
          path: mag-command-center.cdx.json

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux deb rpm appimage
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux
            build_args: ""
            rust_target: ""
          - name: macOS dmg app
            os: macos-14
            bundles: dmg,app
            artifact: macos-apple-silicon
            build_args: ""
            rust_target: ""
          - name: macOS Intel dmg app
            os: macos-14
            bundles: dmg,app
            artifact: macos-intel
            build_args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - name: Windows nsis msi
            os: windows-2022
            bundles: nsis,msi
            artifact: windows
            build_args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install Windows bundler dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis wixtoolset -y --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build desktop bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.build_args }}

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: mag-command-center-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.rpm
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Attest Linux release bundles
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attest macOS release bundles
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'macOS'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: src-tauri/target/**/release/bundle/dmg/*.dmg

      - name: Attest Windows release bundles
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.rpm
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*.exe
