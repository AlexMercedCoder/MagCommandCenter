name: Desktop Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege: every job reads only. The tag-gated publish job alone gets write,
# OIDC, and attestation permissions.
permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Frontend quality and browser smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Release metadata (strict on tags, advisory otherwise)
        run: python3 scripts/check_release_metadata.py
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results
      - run: npm audit --audit-level=high
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > mag-command-center.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: mag-command-center-sbom
          path: mag-command-center.cdx.json

  build:
    needs: quality
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux deb rpm appimage
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: linux
            build_args: ""
            rust_target: ""
          - name: macOS dmg app
            os: macos-14
            bundles: dmg,app
            artifact: macos-apple-silicon
            build_args: ""
            rust_target: ""
          - name: macOS Intel dmg app
            os: macos-14
            bundles: dmg,app
            artifact: macos-intel
            build_args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - name: Windows nsis msi
            os: windows-2022
            bundles: nsis,msi
            artifact: windows
            build_args: ""
            rust_target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Install Windows bundler dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis wixtoolset -y --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Configure macOS signing and notarization (skipped without secrets)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MCC_ARTIFACT_LABEL: ${{ matrix.artifact }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: scripts/signing/configure-macos.sh

      - name: Configure Windows signing (skipped without secrets)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: ./scripts/signing/configure-windows.ps1

      - name: Configure signed updater artifacts (skipped without secrets)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MCC_UPDATER_PUBKEY: ${{ vars.MCC_UPDATER_PUBKEY }}
        run: scripts/updater/configure.sh

      - name: Record Linux signing status
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "MCC_SIGNING_STATUS=unsigned (verify with SHA256SUMS and the build provenance attestation)" >> "$GITHUB_ENV"
          echo "- linux: unsigned; verify with SHA256SUMS and build provenance" >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build desktop bundles
        shell: bash
        # MCC_TAURI_ARGS carries the Windows signing overlay when signing is configured.
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.build_args }} ${MCC_TAURI_ARGS:-}

      - name: Verify macOS signature
        if: runner.os == 'macOS' && startsWith(env.MCC_SIGNING_STATUS, 'signed')
        shell: bash
        run: |
          app="$(find src-tauri/target -maxdepth 6 -path '*/release/bundle/macos/*.app' | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          if [ "$MCC_SIGNING_STATUS" = "signed and notarized" ]; then
            spctl --assess --type execute --verbose=2 "$app"
          fi

      - name: Verify Windows signatures
        if: runner.os == 'Windows' && startsWith(env.MCC_SIGNING_STATUS, 'signed')
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi, *.exe
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): signature is $($signature.Status)" }
            Write-Host "$($file.Name): $($signature.SignerCertificate.Subject)"
          }

      - name: Write signing status for the release notes
        shell: bash
        run: |
          mkdir -p src-tauri/target/release/bundle
          echo "${{ matrix.artifact }}: ${MCC_SIGNING_STATUS:-unsigned}" > "src-tauri/target/release/bundle/signing-status-${{ matrix.artifact }}.txt"

      - name: Generate CycloneDX SBOM for the native crates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path src-tauri/Cargo.toml --format json --target all --override-filename mag-command-center-native.cdx
          ls -l src-tauri/mag-command-center-native.cdx.json

      - name: Upload native SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mag-command-center-native-sbom
          path: src-tauri/mag-command-center-native.cdx.json

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: mag-command-center-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/*/release/bundle/**/*.sig
            src-tauri/target/*/release/bundle/**/*.app.tar.gz
            src-tauri/target/*/release/bundle/**/*.deb
            src-tauri/target/*/release/bundle/**/*.rpm
            src-tauri/target/*/release/bundle/**/*.AppImage
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*.exe
            src-tauri/target/release/bundle/signing-status-*.txt
          if-no-files-found: error

  upgrade-test:
    # Installs the previous GitHub release, seeds projects, sessions, and settings into
    # its state database, installs this build over it, and asserts the data survived and
    # the new build migrated it. See docs/RELEASE_BUILDS.md "Packaged upgrade test".
    needs: build
    name: Packaged upgrade (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux deb and AppImage
            os: ubuntu-22.04
            artifact: linux
          - name: Windows msi
            os: windows-2022
            artifact: windows
    env:
      GH_TOKEN: ${{ github.token }}
      UPGRADE_LOG_DIR: ${{ github.workspace }}/upgrade-logs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: mag-command-center-${{ matrix.artifact }}
          path: new

      - name: Download the previous release
        id: previous
        shell: bash
        run: scripts/upgrade-test/previous-release.sh ${{ matrix.artifact }} previous

      - name: Read the new native version
        id: version
        shell: bash
        run: echo "native=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])" 2>/dev/null || python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Upgrade test (Linux)
        if: runner.os == 'Linux' && steps.previous.outputs.found == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
          old_appimage="$(find previous -name '*.AppImage' | head -1)"
          new_appimage="$(find new -name '*.AppImage' | head -1)"
          appimage_args=()
          if [ -n "$old_appimage" ] && [ -n "$new_appimage" ]; then
            appimage_args=(--old-appimage "$old_appimage" --new-appimage "$new_appimage")
          fi
          scripts/upgrade-test/linux.sh \
            --new-version "${{ steps.version.outputs.native }}" \
            --old-deb "$(find previous -name '*.deb' | head -1)" \
            --new-deb "$(find new -name '*.deb' | head -1)" \
            "${appimage_args[@]}"

      - name: Upgrade test (Windows)
        if: runner.os == 'Windows' && steps.previous.outputs.found == 'true'
        shell: pwsh
        run: |
          $old = Get-ChildItem previous -Recurse -Filter *.msi | Select-Object -First 1
          $new = Get-ChildItem new -Recurse -Filter *.msi | Select-Object -First 1
          ./scripts/upgrade-test/windows.ps1 -OldMsi $old.FullName -NewMsi $new.FullName -NewVersion "${{ steps.version.outputs.native }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upgrade-test-logs-${{ matrix.artifact }}
          path: upgrade-logs
          if-no-files-found: ignore

  publish:
    name: Publish verified installers
    needs: [quality, build, upgrade-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Strict release metadata check
        run: python3 scripts/check_release_metadata.py --strict

      - uses: actions/download-artifact@v7
        with:
          pattern: mag-command-center-*
          path: release-artifacts

      - name: Collect installers, SBOMs, and SHA256SUMS
        shell: bash
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.cdx.json' \
            -o -name '*.sig' -o -name '*.app.tar.gz' \) \
            -exec cp -n {} dist/ \;
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/updater/latest_json.py --dir dist --version "$version" \
            --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --notes "docs/RELEASE_NOTES_${version}.md"
          # Every platform's installers must be present; updater files are optional.
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.dmg' '*.msi' '*.exe' '*.cdx.json'; do
            compgen -G "dist/$pattern" > /dev/null || { echo "missing release file: $pattern" >&2; exit 1; }
          done
          (cd dist && sha256sum -- * > SHA256SUMS && sha256sum -c SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
            dist/*.exe

      - name: Compose release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/RELEASE_NOTES_${version}.md"
          cat "$notes" > release-body.md
          {
            echo
            echo "## Verify your download"
            echo
            echo 'Every file is listed in `SHA256SUMS`. Check one with `sha256sum -c SHA256SUMS --ignore-missing`'
            echo "(macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`), and check its provenance with"
            echo "\`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            echo 'The CycloneDX SBOMs cover the frontend (`mag-command-center.cdx.json`) and the native crates (`mag-command-center-native.cdx.json`).'
            echo
            echo "## Signing status"
            echo
            find release-artifacts -name 'signing-status-*.txt' -exec cat {} \; | sort | sed 's/^/- /'
          } >> release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-body.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
            dist/*.exe
            dist/*.cdx.json
            dist/*.sig
            dist/*.app.tar.gz
            dist/latest.json
            dist/SHA256SUMS
          # Installers are checked in the collect step; updater files exist only
          # when the updater key is configured.
          fail_on_unmatched_files: false
